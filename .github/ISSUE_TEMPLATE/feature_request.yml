name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue，并确认建议符合本项目的定位：**单用户、自建、单二进制 + SQLite 的 LLM 聚合网关**。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述当前的不便或缺口，而不是直接给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 期望的行为 / API / 界面。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法或临时绕过方式。
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 这是功能建议，不是安全漏洞（安全漏洞走 SECURITY.md 的私密通道）
          required: true
