name: Bug 报告
description: 报告可复现的功能缺陷
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**安全漏洞请不要用公开 Issue**，请按 SECURITY.md 走私密通道。
        提交前请先搜索现有 Issue，并尽量附上可复现的最小步骤。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 你期望发生什么？实际发生了什么？
      placeholder: 例如：车道有两个成员，第一个返回 401 后没有逃逸到第二个。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好；能给出 curl 命令或界面操作路径最佳。
      placeholder: |
        1. PUT /api/v1/channels/...
        2. PUT /api/v1/lanes/...
        3. POST /v1/chat/completions ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / commit
      description: 给出部署所用的 commit 或镜像 tag。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 部署方式与环境
      description: Docker / 裸机、操作系统、是否走反向代理、车道模式等。
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 相关日志或报错
      description: "**请脱敏**：不要粘贴管理密钥、客户端密钥、渠道 key、口令或真实渠道地址。"
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认这不是安全漏洞（安全漏洞走 SECURITY.md 的私密通道）
          required: true
        - label: 我已去除日志与配置中的密钥、口令、真实地址等敏感信息
          required: true
