# PowerBarRations 单容器部署样例（design-v1 §1.5：只支持 SQLite 单节点）。
#
#   PBR_SESSION_SECRET / PBR_CRYPTO_SECRET 必须显式提供，不要用示例值：
#     export PBR_SESSION_SECRET="$(openssl rand -hex 32)"
#     export PBR_CRYPTO_SECRET="$(openssl rand -hex 32)"
#     docker compose up -d --build
#
# 起服务后：
#   1) 设登录口令：POST /api/v1/setup  {"password":"<长随机串>"}（响应含一次性管理密钥）
#   2) 建渠道：PUT /api/v1/channels/{name}
#   3) 建客户端密钥：POST /api/v1/keys（响应含一次性明文）
#   4) 下游把 base_url 指到 http://<host>:5700/v1（明文 HTTP 基线；需要 HTTPS 请在外部
#      反向代理终结 TLS 后转发到本端口，见 README §5.1）。
services:
  pbr:
    build:
      context: .
      args:
        VERSION: ${PBR_VERSION:-dev}
        # 国内源为默认；如需改用官方代理：export PBR_GOPROXY=https://proxy.golang.org,direct
        GOPROXY: ${PBR_GOPROXY:-https://goproxy.cn,direct}
    image: powerbar-rations:${PBR_VERSION:-dev}
    container_name: pbr
    restart: unless-stopped
    ports:
      - "${PBR_PORT:-5700}:5700"
    environment:
      PORT: "5700"
      # 默认监听 0.0.0.0 对局域网开放；要收紧改成 127.0.0.1（api-spec §1）。
      PBR_BIND: "${PBR_BIND:-0.0.0.0}"
      # 本服务只跑明文 HTTP，不提供 TLS。需要 HTTPS 请在外部反向代理终结 TLS
      # 再转发到本端口（见 README §5.1）；代理场景可设 SESSION_COOKIE_SECURE=true。
      SQLITE_PATH: "/data/pbr.db?_pragma=busy_timeout(30000)&_pragma=journal_mode(WAL)&_txlock=immediate"
      SESSION_SECRET: "${PBR_SESSION_SECRET:?请先 export PBR_SESSION_SECRET=$(openssl rand -hex 32)}"
      CRYPTO_SECRET: "${PBR_CRYPTO_SECRET:?请先 export PBR_CRYPTO_SECRET=$(openssl rand -hex 32)}"
      GIN_MODE: "release"
      # 无头/AI 部署可直接指定管理密钥（覆盖口令派生，token-spec §2.4）：
      #   PBR_ADMIN_KEY  单把；PBR_ADMIN_KEYS  多把，逗号分隔（轮换过渡）。
      # PBR_ADMIN_KEY: "${PBR_ADMIN_KEY:-}"
      # PBR_ADMIN_KEYS: "${PBR_ADMIN_KEYS:-}"
    volumes:
      - pbr-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5700/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pbr-data:
